name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least privilege (#282): read-only by default. This workflow only checks
# out code, runs scripts, and builds Jekyll -- no job needs more.
permissions:
  contents: read

# A superseded push cancels its in-flight run instead of letting a whole
# duplicate Jekyll-matrix run finish (#418); same group pattern as e2e.yml.
concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Test with Jekyll ${{ matrix.jekyll }}"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        jekyll: ["~> 3.9", "~> 4.2"]
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check image sizes
        run: script/check-images
      - name: Check external attachment images (#195)
        run: script/check-external-images
      - name: Check image alt texts (#87)
        run: |
          if grep -rn '!\[\]' _posts/; then
            echo "::error::Empty image alt text found in _posts!"
            exit 1
          fi
      - name: Set Up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run tests
        run: script/cibuild
