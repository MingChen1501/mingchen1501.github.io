name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Re-run the suite after regenerating (proves determinism)"
        required: false
        default: "true"

# Least privilege (#282): read-only by default. The regenerate job uploads
# the baselines artifact, so it declares its own `actions` scope below.
permissions:
  contents: read

# Baselines are canonical on the CI runner (#208): font rasterization differs
# between machines, so captures generated locally fail here on page height and
# pixel diffs. Regenerate via this workflow, download the artifact, commit it.
jobs:
  regenerate:
    name: "Regenerate visual baselines"
    runs-on: "ubuntu-latest"
    # `actions: write` for the "Upload baselines" step (actions/upload-artifact).
    # `contents: read` is restated because a job-level `permissions` block
    # replaces (not merges with) the top-level block.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install E2E dependencies
        run: pip install -r tests/e2e/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Set Up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Regenerate baselines
        run: UPDATE_BASELINES=1 python -m pytest tests/e2e/test_visual_regression.py -q -k test_visual_baseline
      - name: Verify regenerated baselines
        if: ${{ inputs.verify == 'true' }}
        run: python -m pytest tests/e2e/test_visual_regression.py -q
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/e2e/visual/baseline/
          if-no-files-found: error
