name: E2E + Lighthouse

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Full-run override (#229): dispatch with full=true (the default) forces
  # the full suite even on a content-only change set.
  workflow_dispatch:
    inputs:
      full:
        description: "Force the full E2E + Lighthouse suite (true) or classify the branch diff (false)"
        required: false
        default: "true"

# Least privilege (#282): read-only by default. Jobs that upload or
# download workflow artifacts declare their own `actions` scope below.
permissions:
  contents: read

# A superseded push cancels its in-flight run instead of letting a whole
# duplicate run finish (#56). One workflow now covers E2E and Lighthouse
# (#320), so one group supersedes both of the old per-workflow runs.
concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Content-only classification (#229): a PR that touches only content paths
  # (_posts/**, _vi_posts/**, assets/img/**, _data/highlights.yml) sets
  # content_only=true and skips the heavy jobs. Any code path -- or any
  # uncertain diff -- defaults to the full suite. No silent skip. The
  # classifier lives in one composite action (#320) so E2E and Lighthouse
  # cannot drift apart.
  classify:
    name: "Classify content-only vs full run"
    runs-on: "ubuntu-latest"
    outputs:
      content_only: ${{ steps.classify.outputs.content_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        uses: ./.github/actions/classify-content-only
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

  # Fast, browser-free guards (image budget, comments/tag markup): no Ruby, no
  # Chromium, no Jekyll build, so they report in seconds (#56). Always run,
  # including on content-only PRs (#229).
  static-guards:
    name: "E2E static guards"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install E2E dependencies
        run: pip install -r tests/e2e/requirements.txt
      - name: Run static guards (images, comments/tag markup)
        run: python -m pytest tests/e2e -v -m static

  # The slow half, built once (#266, #273, #320): one `bundle exec jekyll
  # build` serves the three browser engines (#209) and both LHCI passes
  # (#273) from the same `site` artifact, so a full PR pays one Ruby setup
  # + one build + one upload instead of one per workflow. The consumers
  # download it and point their suites at it instead of rebuilding (the
  # `built_site` fixture reuses the directory as-is, so the engines assert
  # against the identical tree; LHCI serves the same tree). The browser
  # jobs and both LHCI jobs run in parallel, so PR wall-clock is the
  # slowest consumer, not the sum. Skipped on content-only PRs (#229): new
  # posts cannot break layout, JS, or Sass.
  build-site:
    name: "Build site once (#320)"
    needs: classify
    if: needs.classify.outputs.content_only != 'true'
    runs-on: "ubuntu-latest"
    # `actions: write` for the "Upload built site" step
    # (actions/upload-artifact; write covers the same-run downloads too).
    # `contents: read` is restated because a job-level `permissions` block
    # replaces (not merges with) the top-level block.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site with Jekyll
        run: bundle exec jekyll build
      - name: Verify build output
        run: test -f _site/index.html
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  browser-e2e:
    name: "E2E browser (${{ matrix.browser }}): comments, layout, tag chips"
    needs: [classify, build-site]
    if: needs.classify.outputs.content_only != 'true'
    runs-on: "ubuntu-latest"
    # `actions: write` for the "Download built site" step
    # (actions/download-artifact) and the "Upload fresh visual captures"
    # step (actions/upload-artifact; write covers both).
    # `contents: read` is restated because a job-level `permissions` block
    # replaces (not merges with) the top-level block.
    permissions:
      contents: read
      actions: write
    strategy:
      # One engine failing must not hide the others' results.
      fail-fast: false
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download built site (#320)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install E2E dependencies
        run: pip install -r tests/e2e/requirements.txt
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser E2E, layout overflow and tag-chip guards
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          # Shared build from the build-site job (#320): the suite serves
          # this directory instead of running its own `jekyll build`.
          E2E_PREBUILT_SITE: ${{ github.workspace }}/_site
          # Harvest CI-rendered captures on failure: screenshot bytes depend
          # on the machine, so the canonical visual baselines (#208) are
          # collected from this runner, never generated locally.
          SAVE_FRESH_DIR: tests/e2e/visual/fresh
        run: python -m pytest tests/e2e -v -m "not static"
      - name: Upload fresh visual captures (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-fresh-${{ matrix.browser }}
          path: tests/e2e/visual/fresh/
          if-no-files-found: error

  # Desktop pass (#273): unchanged thresholds (performance warn-only at
  # 0.85, accessibility/best-practices/SEO error at 0.90) served from the
  # shared build above, so the mobile pass costs no extra build. Runs on
  # PRs and manual dispatches only (#320): the old standalone Lighthouse
  # workflow never ran on master pushes.
  lighthouse-desktop:
    name: "Lighthouse CI (desktop)"
    needs: [classify, build-site]
    if: needs.classify.outputs.content_only != 'true' && github.event_name != 'push'
    runs-on: "ubuntu-latest"
    # `actions: write` for the "Download built site" step
    # (actions/download-artifact) and the "Upload Lighthouse report" step
    # (actions/upload-artifact; write covers both).
    # `contents: read` is restated because a job-level `permissions` block
    # replaces (not merges with) the top-level block.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download built site (#320)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      # NOTE (#195): pages embedding external attachment images
      # (`https://github.com/user-attachments/assets/...`) are measured as-is;
      # no origin is blocked. Attachment-hosted bytes are exempt from the local
      # 6MB `assets/img/` budget (enforced by script/check-images) instead of
      # carrying a byte threshold here, because the site does not control
      # their compression. Remove this exemption on storage migration.
      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-desktop
          path: .lighthouseci/
          retention-days: 7
          # .lighthouseci/ is a dot-directory, skipped by default (#319).
          include-hidden-files: true
          # Fail loudly on a future miss instead of warning (#319).
          if-no-files-found: error

  # Mobile-emulation pass (#273): default (mobile) emulation, no `desktop`
  # preset, over `/`, the photo-heavy Tet 2023 posts (EN/VI, full-size
  # portrait phone photos that dominate mobile LCP and are invisible to the
  # desktop pass), and `/tags/`. `numberOfRuns: 3` damps single-run noise
  # (assert uses the median); performance stays warn-only at 0.85 so mobile
  # noise never blocks a PR, matching desktop. Fixing whatever this flags is
  # follow-up work -- this job only makes the signal visible. Runs on PRs
  # and manual dispatches only (see above).
  lighthouse-mobile:
    name: "Lighthouse CI (mobile)"
    needs: [classify, build-site]
    if: needs.classify.outputs.content_only != 'true' && github.event_name != 'push'
    runs-on: "ubuntu-latest"
    # `actions: write` for the "Download built site" step
    # (actions/download-artifact) and the "Upload Lighthouse report" step
    # (actions/upload-artifact; write covers both).
    # `contents: read` is restated because a job-level `permissions` block
    # replaces (not merges with) the top-level block.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download built site (#320)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-mobile
          path: .lighthouseci/
          retention-days: 7
          # .lighthouseci/ is a dot-directory, skipped by default (#319).
          include-hidden-files: true
          # Fail loudly on a future miss instead of warning (#319).
          if-no-files-found: error

  # Stable aggregator for branch protection (#229): a skipped browser matrix
  # reports "skipped", which never satisfies a required check, so protect
  # THIS job instead. It passes when the full matrix passed, or when a
  # content-only PR skipped the matrix with green static guards.
  e2e-summary:
    name: "E2E suite result"
    runs-on: "ubuntu-latest"
    needs: [classify, static-guards, build-site, browser-e2e]
    if: always()
    steps:
      - name: Report suite result
        run: |
          if [ "${{ needs.classify.outputs.content_only }}" = "true" ]; then
            echo "Content-only PR: browser matrix skipped by design (#229)."
            [ "${{ needs.static-guards.result }}" = "success" ]
          else
            [ "${{ needs.static-guards.result }}" = "success" ] && \
            [ "${{ needs.build-site.result }}" = "success" ] && \
            [ "${{ needs.browser-e2e.result }}" = "success" ]
          fi

  # Stable aggregator for branch protection (#229): see E2E suite result.
  # Lighthouse runs on PRs and manual dispatches only (#320), so a master
  # push or a content-only PR reports success without the LHCI jobs.
  lighthouse-summary:
    name: "Lighthouse suite result"
    runs-on: "ubuntu-latest"
    needs: [classify, lighthouse-desktop, lighthouse-mobile]
    if: always()
    steps:
      - name: Report suite result
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push to master: Lighthouse runs on PRs only (#320)."
            exit 0
          fi
          if [ "${{ needs.classify.outputs.content_only }}" = "true" ]; then
            echo "Content-only PR: Lighthouse skipped by design (#229)."
            exit 0
          fi
          [ "${{ needs.lighthouse-desktop.result }}" = "success" ] && \
          [ "${{ needs.lighthouse-mobile.result }}" = "success" ]
