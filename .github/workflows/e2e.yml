name: E2E

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A superseded push cancels its in-flight run instead of letting a whole
# duplicate run finish (#56).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, browser-free guards (image budget, comments/tag markup): no Ruby, no
  # Chromium, no Jekyll build, so they report in seconds (#56).
  static-guards:
    name: "E2E static guards"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install E2E dependencies
        run: pip install -r tests/e2e/requirements.txt
      - name: Run static guards (images, comments/tag markup)
        run: python -m pytest tests/e2e -v -m static

  # The slow half: one shared Jekyll build, one shared Playwright browser
  # (`tests/e2e/conftest.py`), and the browser guards that use them.
  browser-e2e:
    name: "E2E browser: comments, layout, tag chips"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install E2E dependencies
        run: pip install -r tests/e2e/requirements.txt
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Set Up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run browser E2E, layout overflow and tag-chip guards
        run: python -m pytest tests/e2e -v -m "not static"
