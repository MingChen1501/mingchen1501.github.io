title: Chen Ming
url: "https://mingchen.id.vn" # prod domain (must match CNAME); keeps canonical/SEO/feed URLs correct
author:
  name: Trần Công Minh
  email: tminh400@gmail.com
description: > # this means to ignore newlines until "show_excerpts:"
  Hola world, mình là Ming, đây là nơi mình chia sẻ linh tinh trong học tập và cuộc sống

# Minima-specific settings
minima:
  # Minima skin selection.
  skin: classic
  date_format: "Bài viết được đăng lúc: %d-%m-%Y."
  show_excerpts: true

  # Specific pages for site navigation.
  nav_pages:
    - about.md
    - portfolio.md
    - tags.md

  # Social Media Links.
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/MingChen1501"
    - title: Facebook
      icon: facebook
      url: "https://facebook.com/mingchenn1501"
    - title: Instagram
      icon: instagram
      url: "https://instagram.com/mingchenn1501"
    - title: LinkedIn
      icon: linkedin
      url: "https://linkedin.com/in/mingchen1501"
    - title: YouTube
      icon: youtube
      url: "https://www.youtube.com/channel/UCriw08sS1Jg4ftN8Wd3Wefg"

# Build settings
# Keep the repository internals out of the public site (#82): the agent guide
# and kit, the E2E test suite, the CI helper scripts, the gem metadata, the
# project docs and the retired Unity WebGL demo payload.
exclude:
  - AGENTS.md
  - .opencode
  - tests
  - script
  - Gemfile
  - Gemfile.lock
  - minima.gemspec
  - README.md
  - LICENSE.txt
  - CODE_OF_CONDUCT.md
  - gam102.html
  - Build
  - TemplateData

theme: minima

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-redirect-from
 - jekyll-paginate

paginate: 5
paginate_path: "/page:num/"

# Comments
comments:
  provider: giscus   # none | giscus | disqus
  dev: false         # render comments in non-production builds for testing

# Giscus (GitHub Discussions) configuration
giscus:
  repo: MingChen1501/mingchen1501.github.io
  repo_id: R_kgDOHBJg8A
  category: Announcements
  category_id: DIC_kwDOHBJg8M4DIbBW
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: bottom
  theme: preferred_color_scheme
  lang: vi
  loading: lazy
