title: Chen Ming
url: "https://mingchen.id.vn" # prod domain (must match CNAME); keeps canonical/SEO/feed URLs correct
lang: en # default language; every Vietnamese page sets `lang: vi` (#93)
author:
  name: Trần Công Minh
  name_en: Tran Cong Minh
  email: mingchen1501@gmail.com
description: > # this means to ignore newlines until "show_excerpts:"
  Hola world, mình là Ming, đây là nơi mình chia sẻ linh tinh trong học tập và cuộc sống
description_en: >
  Hola world, I'm Ming — this is where I share bits and pieces about learning and everyday life.

# Minima-specific settings
minima:
  # Minima skin selection. `auto` is the adaptive skin built on the classic
  # (light) and dark palettes: readers without JS follow their OS
  # `prefers-color-scheme` via CSS alone, and the #220 theme toggle pins an
  # explicit choice through the `data-theme` layer in
  # `_sass/minima/custom/_theme-toggle.scss`. Light values are identical to
  # `classic` (same `$lm-*` defaults), so light mode renders unchanged.
  skin: auto
  date_format: "Bài viết được đăng lúc: %d-%m-%Y."
  show_excerpts: true

  # Specific pages for site navigation.
  nav_pages:
    - about.md
    - portfolio.md
    - tags.md
    - search.md

  # Social Media Links.
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/MingChen1501"
    - title: Facebook
      icon: facebook
      url: "https://facebook.com/mingchenn1501"
    - title: Instagram
      icon: instagram
      url: "https://instagram.com/mingchenn1501"
    - title: LinkedIn
      icon: linkedin
      url: "https://linkedin.com/in/mingchen1501"
    - title: YouTube
      icon: youtube
      url: "https://www.youtube.com/channel/UCriw08sS1Jg4ftN8Wd3Wefg"

# Build settings
# Keep the repository internals out of the public site (#82): the agent guide
# and kit, the E2E test suite, the CI helper scripts, the gem metadata, the
# project docs and the retired Unity WebGL demo payload. The demo files were
# removed from the working tree (#186) but stay listed here as belt-and-braces
# so a re-added file can never be published again.
exclude:
  - AGENTS.md
  - .opencode
  - tests
  - script
  - Gemfile
  - Gemfile.lock
  - minima.gemspec
  - README.md
  - LICENSE.txt
  - CODE_OF_CONDUCT.md
  - docs
  - gam102.html
  - Build
  - TemplateData

theme: minima

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-redirect-from
 - jekyll-paginate

paginate: 5
paginate_path: "/page:num/"

# Bilingual structure (#93): English posts live in `_posts/` (so `site.posts`,
# jekyll-paginate and jekyll-feed stay English-only with no plugin), Vietnamese
# translations live in this collection and render under `/vi/...`.
# Hard constraint: GitHub Pages builds with `--safe`, so no polyglot plugin;
# i18n is Liquid + directory structure only.
collections:
  vi_posts:
    output: true
    permalink: /vi/:year/:month/:day/:title.html

# Comments
comments:
  provider: giscus   # none | giscus | disqus
  dev: false         # render comments in non-production builds for testing

# Giscus (GitHub Discussions) configuration
giscus:
  repo: MingChen1501/mingchen1501.github.io
  repo_id: R_kgDOHBJg8A
  category: Announcements
  category_id: DIC_kwDOHBJg8M4DIbBW
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: bottom
  theme: preferred_color_scheme
  # Giscus theme sync (#258): the site theme (light/dark from the #220 toggle)
  # is pushed into the Giscus iframe at runtime via `setConfig`, so the saved
  # `theme` above is only the pre-JS/no-JS fallback. These two name the Giscus
  # themes the site light/dark modes map to (any theme from
  # https://giscus.app works, e.g. `light_high_contrast`).
  light_theme: light
  dark_theme: dark
  lang: vi
  loading: lazy
