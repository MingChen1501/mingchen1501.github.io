title: Chen Ming
author:
  name: Trần Công Minh
  email: tminh400@gmail.com
description: > # this means to ignore newlines until "show_excerpts:"
  Hola world, mình là Ming, đây là nơi mình chia sẻ linh tinh trong học tập và cuộc sống

# If you want to link only specific pages in your header, list them here
# under `minima.nav_pages` (paths as represented via Liquid).
header_pages:
  - about.md
  - portfolio.md

# Build settings
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  quiet_deps: true
  silence_deprecations: [import]

minima:
  # Skin selection: classic, dark, auto, solarized, solarized-light, solarized-dark
  skin: classic

  # Specific pages for site navigation
  nav_pages:
    - about.md
    - portfolio.md

  show_excerpts: true

  date_format: "Bài viết được đăng lúc: %d-%m-%Y."

  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/MingChen1501"
    - title: Facebook
      icon: facebook
      url: "https://facebook.com/mingchenn1501"
    - title: Instagram
      icon: instagram
      url: "https://instagram.com/mingchenn1501"
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/mingchen1501"
    - title: YouTube (MinG Chen)
      icon: youtube
      url: "https://www.youtube.com/channel/UCriw08sS1Jg4ftN8Wd3Wefg"
