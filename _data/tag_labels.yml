# Single source of truth for tag display labels, localized URL slugs (#129),
# one-line topic descriptions for the tag index pages (#140), and the curated
# pillar list for the sidebar and the tag indexes (#344).
#
# Post front matter keeps the canonical tag key (e.g. `doi-song`); templates
# resolve the human-readable label and the tag-page URL slug for the current
# `page.lang` from this file. The lifestyle pillar is localized: English pages
# show "Life" at `/tags/life/`, Vietnamese pages show "Đời sống" at
# `/vi/tags/doi-song/`. Technical tags keep the same slug and the English
# label in both languages (owner decision, #129).
#
# `description_en` / `description_vi` are the one-line topic summaries shown
# on the tag indexes (`tags.md`, `vi/tags.md`). The wording reuses the
# per-tag page bodies (`tags/*.md`, `vi/tags/*.md`) flattened to a single
# line — keep them in sync when that copy changes so the two cannot drift
# apart. The individual tag pages keep rendering their own body copy via
# `_layouts/tag.html` (`{{ content }}`), so the descriptions are NOT repeated
# there.
#
# `pillar: true|false` and `order: <int>` drive the curated presentation
# (#344): the sidebar (`_includes/site-sidebar.html`) renders only
# `pillar: true` tags, sorted by ascending `order`, capped at 6 with an
# "All topics" / "Tất cả chủ đề" link to the tag index; the tag indexes
# list pillars first by `order`, then every other tag with at least one
# published post under "More topics" / "Chủ đề khác" sorted by the localized
# label. Tags with no published post never render. A brand-new tag needs only
# a data-file entry (`pillar: false`) — or no entry at all, in which case the
# label and slug fall back to the canonical key — plus its tag page; no
# template edits. Within equal `order` values (or a missing `order`) the
# tiebreaker is the localized label, never the raw key. Keep `order` values
# unique, ascending, and below 1000 (templates zero-pad them for string
# sorting). The four existing pillars keep their current presentation order.
backend-production:
  en: Backend Production
  vi: Backend Production
  slug_en: backend-production
  slug_vi: backend-production
  description_en: "Backend production: running real systems — infrastructure, networking, data and lessons from serving real users."
  description_vi: "Backend production: vận hành hệ thống thật — hạ tầng, mạng, dữ liệu và những bài học khi chạy sản phẩm cho người dùng thật."
  pillar: true
  order: 1
