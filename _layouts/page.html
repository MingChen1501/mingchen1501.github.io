---
layout: base
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {%- if page.fallback_vi -%}
      {%- include vi-fallback-notice.html -%}
    {%- endif -%}
    {{ content }}
  </div>

</article>
