<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {%- include head.html -%}

  <body class="layout-{{ page.layout | default: 'page' }}">

    {#87: skip link — first focusable element, hidden until focused.#}
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content" id="main-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    {%- include sub-footer.html -%}

  </body>

</html>
