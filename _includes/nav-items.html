<div class="nav-items" id="nav-menu">
  {%- for path in include.paths -%}
  {%- assign nav_page = site.pages | where: "path", path | first -%}
  {%- if nav_page.title %}
  <a class="nav-item" href="{{ nav_page.url | relative_url }}">{{ nav_page.title | escape }}</a>
  {%- endif -%}
  {%- endfor %}
</div>
